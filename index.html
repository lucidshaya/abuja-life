<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b2a18" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Abuja Life — a 3D open-world browser game with real Abuja vibes. Explore Wuse 2, Maitama, Garki, Jabi, Gwarinpa and Kubwa on PC or phone." />
    <title>Abuja Life</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='21' height='64' fill='%23008751'/><rect x='21' width='22' height='64' fill='%23fff'/><rect x='43' width='21' height='64' fill='%23008751'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="hud" class="hidden"></div>
    <div id="touch" class="hidden"></div>
    <div id="dialogue" class="hidden"></div>
    <div id="map" class="hidden"></div>
    <div id="customizer" class="hidden"></div>
    <div id="travel" class="screen hidden"></div>
    <button id="mute" class="hidden" type="button" aria-label="Mute" title="Mute (N)">
      <svg class="ic-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="ic-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button id="phonebtn" type="button" aria-label="Phone (Q)" title="Phone (Q)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="18.2" r="1.1" fill="currentColor"/></svg>
    </button>
    <div id="phone" class="hidden"></div>
    <div id="fade"></div>
    <div id="menu" class="screen hidden"></div>
    <div id="pause" class="screen hidden"></div>
    <div id="settings" class="screen hidden"></div>
    <div id="help" class="screen hidden"></div>
    <div id="loading" class="screen">
      <div class="load-card">
        <div class="logo"><span class="l1">ABUJA</span><span class="l2">LIFE</span></div>
        <div class="bar"><div id="load-fill"></div></div>
        <div id="load-msg">Loading…</div>
        <div class="load-tip" id="load-tip"></div>
      </div>
    </div>
    <div id="rotate">
      <div class="rot-icon">📱↻</div>
      <div>Turn your phone sideways for the best Abuja experience</div>
      <button id="rotate-dismiss" class="btn small" type="button">Play anyway</button>
    </div>
    <div id="fatal" class="screen hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
